<div class="container-fluid mb-5">
    <div class="row">
        <div class="col-md-3">
            <app-sidebar></app-sidebar>
        </div>
        <div class="col-md-9 mt-5">
            <div class="row">
                <div class="col-md-12">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                          <li class="breadcrumb-item"><a routerLink="/home" class="text-decoration-none">Home</a></li>
                          <li class="breadcrumb-item active" aria-current="page">Change Password</li>
                        </ol>
                    </nav>
                </div>
            </div>
            <div *ngIf="change == true" class="alert alert-warning alert-dismissible fade show" role="alert">
                <strong>Password Changed</strong>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" (click)="close()"></button>
              </div>
            <div class="card">
                <div class="card-header bg-primary text-light"><h4>CHANGE PASSWORD</h4></div>
                <div class="card-body">
                    <form [formGroup]="passForm" (ngSubmit)="passData()">
                        <div class="row">
                            <div class="col-md-6 mt-2">
                                <label>Current Password</label>
                                <input placeholder="Enter Current Password" class='form-control' type="password" formControlName="opass" />
                                <div *ngIf="passForm.get('opass')?.invalid && passForm.get('opass')?.touched" class="text-danger">
                                    <span *ngIf="passForm.get('opass')?.errors?.['required']"> Please Enter Current Password</span>
                                </div>
                                <div *ngIf="wrongpass==true" class="text-danger">
                                    <span>Wrong Password !</span>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mt-2">
                                <label>New Password</label>
                                <input placeholder="Enter New Password" class='form-control' type="password" formControlName="npass" />
                                <div *ngIf="passForm.get('npass')?.invalid && passForm.get('npass')?.touched" class="text-danger">
                                    <span *ngIf="passForm.get('npass')?.errors?.['required']"> Please Enter New Password</span>
                                    <span *ngIf="passForm.get('npass')?.errors?.['minlength']"> Password should be atleat 5 characters</span>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mt-2">
                                <label>Re-Type New Password</label>
                                <input placeholder="Enter Re-Type Password" class='form-control' type="password" formControlName="rpass">
                                <div *ngIf="passForm.get('rpass')?.invalid && passForm.get('rpass')?.touched" class="text-danger">
                                    <span *ngIf="passForm.get('rpass')?.errors?.['required']"> Please Re-Type New Password</span>
                                    <span *ngIf="passForm.get('rpass')?.errors?.['minlength']"> Password should be atleat 5 characters</span>
                                </div>
                            </div>
                        </div>
                        <div *ngIf="matchpass==true" class="text-danger">
                            <span>Both the new Password are Not Match !</span>
                        </div>
                        <div class="row mt-3">
                            <div class="col-md-6 d-flex justify-content-end">
                                <input type="submit" class="btn btn-dark" value="Change Password">
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
