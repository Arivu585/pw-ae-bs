<div class="container-fluid mb-5">
  <div class="row">
    <div class="col-md-3">
      <app-sidebar></app-sidebar>
    </div>
    <div class="col-md-9 mt-5">
      <div class="row">
        <div class="col-md-12">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a routerLink="/home" class="text-decoration-none">Home</a></li>
              <li class="breadcrumb-item active" aria-current="page">Invoice View</li>
            </ol>
          </nav>
        </div>
      </div>
      @if (delete==true) {
        <div class="row">
          <div class="col-md-12">
            <div class="alert alert-primary alert-dismissible fade show" role="alert">
              <strong>Invoice Deleted</strong>
              <button type="button" class="btn-close" data-bs-dismiss="alert" (click)="close()" aria-label="Close"></button>
            </div>
          </div>
        </div>
      }
      <div class="row">
        <div class="col-md-12">
          <div class="table-responsive">
            <table class="table table-bordered">
              <thead class="text-center">
                <tr>
                  <th>Invoice No</th>
                  <th>Date</th>
                  <th>Customer Name</th>
                  <th>Total</th>
                  <th>Pay Mode</th>
                  <th colspan="3">Action</th>
                </tr>
              </thead>
              <tbody>
                @for (row of invoice; track row; let i = $index) {
                  <tr>
                    <td class="text-center">{{row.ino}}</td>
                    <td>{{row.idate}}</td>
                    <td>{{row.cname}}, {{row.city}}, {{row.address}}</td>
                    <td>{{row.itotal}}</td>
                    <td>{{row.ipay}}</td>
                    <td class="text-center"><a [routerLink]="['/invoice_edit',row.iid]" class="btn btn-success" title="Edit Invoice of {{row.ino}}"><i class="fa fa-pencil"></i></a></td>
                    <td class="text-center"><a class="btn btn-danger" (click)="remove(row.iid)" title="Delete Invoice of {{row.ino}}"><i class="fa fa-trash"></i></a></td>
                    <td class="text-center"><a (click)="print(row.iid)" class="btn btn-info" title="Print Invoice of {{row.ino}}"><i class="fa fa-print"></i></a></td>
                  </tr>
                }
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
