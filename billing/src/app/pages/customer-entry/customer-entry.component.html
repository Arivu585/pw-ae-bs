<div class="container-fluid mb-5">
    <div class="row">
        <div class="col-md-3">
            <app-sidebar></app-sidebar>
        </div>
        <div class="col-md-9 mt-5">
            <div class="row">
                <div class="col-md-12">
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                          <li class="breadcrumb-item"><a routerLink="/home" class="text-decoration-none">Home</a></li>
                          <li class="breadcrumb-item active" aria-current="page">Customer Entry</li>
                        </ol>
                    </nav>
                </div>
            </div>
            <div class="row" *ngIf="status==true">
                <div class="col-md-12">
                    <div class="alert alert-primary alert-dismissible fade show" role="alert">
                        <strong>Customer Added</strong>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" (click)="close()" aria-label="Close"></button>
                      </div>
                </div>
            </div>
            <form action="" [formGroup]="customerForm" (ngSubmit)="saveData()">
                <div class="row form-group">
                    <div class="col-md-6 mt-3">
                        <label>Name</label>
                        <input type="text" class="form-control" formControlName="cname">
                        <div *ngIf="customerForm.get('cname')?.invalid && customerForm.get('cname')?.touched" class="text-danger">
                            <span *ngIf="customerForm.get('cname')?.errors?.['required']"> Please Enter Name </span>
                        </div>
                    </div>
                    <div class="col-md-6 mt-3">
                        <label>Type</label>
                        <select title="Type" class="form-control" formControlName="type">
                            <option value="" disabled>Select Type</option>
                            <option>Customer</option>
                            <option>Supplier</option>
                        </select>
                        <div *ngIf="customerForm.get('type')?.invalid && customerForm.get('type')?.touched" class="text-danger">
                            <span *ngIf="customerForm.get('type')?.errors?.['required']"> Please Select Type </span>
                        </div>
                    </div>
                </div>
                <div class="row form-group">
                    <div class="col-md-6 mt-3">
                        <label>City</label>
                        <input type="text" class="form-control" formControlName="city">
                        <div *ngIf="customerForm.get('city')?.invalid && customerForm.get('city')?.touched" class="text-danger">
                            <span *ngIf="customerForm.get('city')?.errors?.['required']"> Please Enter City </span>
                        </div>
                    </div>
                    <div class="col-md-6 mt-3">
                        <label>Contact</label>
                        <input type="number" min="1" class="form-control" (keypress)="numOnly($event)" formControlName="contact">
                        <div *ngIf="customerForm.get('contact')?.invalid && customerForm.get('contact')?.touched" class="text-danger">
                            <span *ngIf="customerForm.get('contact')?.errors?.['required']"> Please Enter Contact in Numbers </span>
                        </div>
                    </div>
                </div>
                <div class="row form-group">
                    <div class="col-md-12 mt-3">
                        <label>Address</label>
                        <input type="text" class="form-control" formControlName="address">
                        <div *ngIf="customerForm.get('address')?.invalid && customerForm.get('address')?.touched" class="text-danger">
                            <span *ngIf="customerForm.get('address')?.errors?.['required']"> Please Enter Address </span>
                        </div>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col">
                        <input type="submit" class="btn btn-success" value="Add Customer">
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
