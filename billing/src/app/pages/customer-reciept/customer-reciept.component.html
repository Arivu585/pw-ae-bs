<div class="container-fluid mb-5">
  <div class="row">
    <div class="col-md-3">
      <app-sidebar></app-sidebar>
    </div>
    <div class="col-md-9 mt-5">
      <div class="row">
        <div class="col-md-12">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a routerLink="/home" class="text-decoration-none">Home</a></li>
              <li class="breadcrumb-item active" aria-current="page">Customer Reciept</li>
            </ol>
          </nav>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12">
          <div class="table-responsive">
            <table class="table table-bordered">
              <thead class="text-center">
                <tr>
                  <th>S.No</th>
                  <th>Customer Name</th>
                  <th>Contact</th>
                  <th>Pending</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                @for (row of invoice; track row; let i = $index) {
                  <tr>
                    <td class="text-center">{{i+1}}</td>
                    <td>{{row.cname}}</td>
                    <td>{{row.contact}}</td>
                    <th class="text-end text-danger">{{row.balance}}</th>
                    <td class="text-center"><a [routerLink]="['/customer_reciept_entry',row.cid]" class="btn btn-sm btn-info">View</a></td>
                  </tr>
                }
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
